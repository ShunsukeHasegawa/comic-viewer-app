# 静的解析の設定。`flutter analyze` / IDE が参照する。
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    # 生成コードは解析対象外（生成元のコードで担保する）
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # freezed / json_serializable が付ける注釈を許容する
    invalid_annotation_target: ignore
    # TODO は警告にしない（Issue 側で管理する）
    todo: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_relative_imports
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - unawaited_futures
    - unnecessary_parenthesis
    - use_string_in_part_of_directives
