name: comic_laz
description: "Comic LAZ のネイティブアプリ（Android / iOS）。"
# pub.dev への誤公開を防ぐ
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  archive: ^4.3.0
  # 巻の ZIP を OS のバックグラウンド転送で取得する（アプリを閉じても続ける。#10）
  background_downloader: ^9.6.3
  # ネットワーク復帰の検知（未送信の読書進捗を送るきっかけ）
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.8
  # HTTP クライアント（Bearer 付与・ETag・リトライのインターセプタを載せる）
  device_info_plus: ^13.2.0
  dio: ^5.11.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  # 状態管理 / DI
  flutter_riverpod: ^3.4.3
  # モデル（イミュータブルなデータクラス）
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  # ルーティング（Web 版の URL 体系に合わせる）
  go_router: ^18.0.1
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  wakelock_plus: ^1.8.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
