name: comic_laz
description: "Comic LAZ のネイティブアプリ（Android / iOS）。"
# pub.dev への誤公開を防ぐ
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  archive: ^4.3.0
  # 巻の ZIP を OS のバックグラウンド転送で取得する（アプリを閉じても続ける。#10）
  background_downloader: ^9.6.3
  # ネットワーク復帰の検知（未送信の読書進捗を送るきっかけ）
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.8
  # HTTP クライアント（Bearer 付与・ETag・リトライのインターセプタを載せる）
  device_info_plus: ^13.2.0
  dio: ^5.11.1
  # 端末の空き容量（ダウンロード前の容量チェックと設定画面の表示。#13）
  disk_space_2: ^1.0.13
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  # 状態管理 / DI
  flutter_riverpod: ^3.4.3
  # モデル（イミュータブルなデータクラス）
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  # ルーティング（Web 版の URL 体系に合わせる）
  go_router: ^18.0.1
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  wakelock_plus: ^1.8.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  # ランチャーアイコン / 起動スプラッシュの生成（#16。設定は末尾）
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  assets:
    # SplashScreen（トークン検証中の画面）。ネイティブのスプラッシュと同じ絵を
    # 同じ大きさで出し、切り替わりで絵が跳ねないようにする（#16）。
    # assets/branding/ を丸ごと登録しない（生成元の大きな PNG まで同梱されるため）。
    - assets/branding/splash_logo.png

# ---------------------------------------------------------------------------
# ブランディング（#16）。絵を差し替えたら次の 2 つを流し直す（生成物はコミットする）:
#   TMP='C:\Temp\claude-dart' TEMP='C:\Temp\claude-dart' dart run flutter_launcher_icons
#   TMP='C:\Temp\claude-dart' TEMP='C:\Temp\claude-dart' dart run flutter_native_splash:create
#
# assets/branding/ の絵（icon-512x512.png 以外は `python tool/make_branding.py .` で
# 作り直せる。Pillow が要る）:
#   icon-512x512.png       Web 版の PWA アイコン（comic-viewer の frontend/public）そのもの
#   icon_foreground.png    上の吹き出しだけを透過で切り出し、アダプティブアイコンの
#                          安全領域（108dp 中の直径 66dp の円）に収めたもの
#   icon_monochrome.png    同じ形の白シルエット（文字は抜き）。Android 13 のテーマアイコン用
#   splash_android12.png   吹き出しを 288dp の枠の直径 180dp の円に収めたもの（円で切られる）
#   splash_logo.png        吹き出しだけ。154dp 幅（xxxhdpi 換算）で Android 12 と同じ大きさ
#   splash_logo_ios.png    同じ大きさの @3x 版（ツールが iOS は @3x として扱うため）
# ---------------------------------------------------------------------------

flutter_launcher_icons:
  # 既存の ic_launcher を上書きする（マニフェストの参照を変えないため）
  android: true
  ios: true
  # Web 版のアイコンは四隅まで teal で塗られた正方形なので、レガシー（Android 7 以下）と
  # iOS（OS が角を丸める）はそのまま使う。
  image_path: assets/branding/icon-512x512.png
  remove_alpha_ios: true
  background_color_ios: "#244C60"
  # Android 8 以上はランチャーが円 / 角丸などで切り抜く。正方形のアイコンをそのまま
  # 前景にすると吹き出しの角が欠けるので、安全領域に収めた前景 + 単色の背景にする。
  adaptive_icon_background: "#244C60"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png
  # 既定の 16% の inset を足すと二重に縮む（前景の絵で余白を取り済み）
  adaptive_icon_foreground_inset: 0
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter_native_splash:
  # ブランドカラー（AppColors.brand / AppColors.darkBackground と同じ）。
  # 起動直後に白い画面が一瞬出ないよう、Flutter 側の SplashScreen も同じ色にしている。
  color: "#244C60"
  color_dark: "#0a0f1a"
  image: assets/branding/splash_logo.png
  image_ios: assets/branding/splash_logo_ios.png
  android_gravity: center
  ios_content_mode: center
  # Android 12 以上は OS のスプラッシュ API（上の設定は効かない）
  android_12:
    color: "#244C60"
    color_dark: "#0a0f1a"
    image: assets/branding/splash_android12.png
  web: false
